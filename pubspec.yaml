name: pontoclick
description: "PontoClick — controle de ponto simples e seguro."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Tipografia Inter (Umbrel Design System)
  google_fonts: ^6.2.1

  # Geolocalização (GPS) para o card de presença na Home
  geolocator: ^13.0.1

  # Detecção de conexão online/offline
  connectivity_plus: ^6.0.5

  # Persistência local simples (tema escolhido, fila de pontos offline, sessão)
  shared_preferences: ^2.3.2

  # Chamadas HTTP para a API do PontoClick
  http: ^1.2.2

  # Exportação do mês em PDF (tela de Registros)
  pdf: ^3.11.1
  printing: ^5.13.1

  # Escolher foto de perfil na câmera ou na galeria
  image_picker: ^1.1.2

  # Abrir links externos (LinkedIn na tela Sobre)
  url_launcher: ^6.3.0
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ícone do app em todas as plataformas. Para refazer:
#   flutter test tool/generate_icon.dart   (gera assets/icon/*.png a partir do logo)
#   dart run flutter_launcher_icons        (gera os tamanhos de cada plataforma)
#   git checkout -- ios/Runner.xcodeproj/project.pbxproj
#     (a ferramenta troca ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS
#      de YES para AppIcon — bug dela; o valor certo é YES)
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#5351F3"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#000000"
    theme_color: "#5351F3"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
